        public_key_hash:
          type: string
          readOnly: true
          description: Unique public key hash.
        token_name:
          type: string
          readOnly: true
          description: Token name associated with this account.
        is_active:
          type: boolean
          readOnly: true
          description: Is the account active?
      required:
      - is_active
      - policy_id
      - public_key_hash
      - token_name
    ProjectAccountMetricEntry:
      type: object
      properties:
        project:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        metric_label:
          type: string
          readOnly: true
        units:
          type: string
          readOnly: true
        weight:
          type: number
          format: double
          readOnly: true
        description:
          type: string
          readOnly: true
        default_value:
          type: number
          format: double
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        value:
          type: number
          format: double
          readOnly: true
      required:
      - default_value
      - description
      - is_active
      - key
      - metric_label
      - project
      - units
      - value
      - weight
    ProjectEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        accounts:
          type: array
          items:
            type: integer
          readOnly: true
          description: List of Account IDs that have joined this project
        name:
          type: string
          description: A human readable project name
          minLength: 1
          maxLength: 112
        public_key:
          type: string
          description: Public key used to sign valid transitions.
          minLength: 64
          maxLength: 64
        description:
          type: string
          description: Optional human description of the project
          maxLength: 512
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was last updated
        score_decay:
          type: integer
          minimum: 1
          default: 30
          description: The length of time for a user's score to decay by e.
        image:
          type: string
          default: https://placehold.co/500
          description: Image link for the badge
      required:
      - accounts
      - created_at
      - id
      - name
      - public_key
      - updated_at
    ProjectEntryList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: A human readable project name
        description:
          type: string
          readOnly: true
          description: Optional human description of the project
        score_decay:
          type: integer
          readOnly: true
          description: The length of time for a users score to decay by e.
        image:
          type: string
          readOnly: true
          description: URI (http, https, ipfs, data) of an image
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was last updated
      required:
      - created_at
      - description
      - id
      - image
      - is_active
      - name
      - score_decay
      - updated_at
    RangeWindow:
      type: object
      properties:
        invalid_after:
          type: integer
          default: 0
          description: Unix timestamp (seconds). Payload is invalid after this time
            (exclusive).
        invalid_before:
          type: integer
          default: 18446744073709551615
          description: Unix timestamp (seconds). Payload is invalid before this time
            (inclusive).
    Score:
      type: object
      description: Serializer for returning a float field, the reputation score for
        a project.
      properties:
        score:
          type: number
          format: double
          description: An account's reputation score
      required:
      - score
    Scores:
      type: object
      description: Serializer for returning a dictionary of float fields, the reputation
        score for each project.
      properties:
        scores:
          type: object
          additionalProperties:
            type: number
            format: double
          nullable: true
    SignatureBlock:
      type: object
      properties:
        key:
          type: string
          description: 'Public key of the signer (encoding TBD: hex/base58/base64).'
        msg:
          type: string
          description: Hex-encoded message that was signed (e.g., CBOR→Blake2b-256).
        sig:
          type: string
          description: Hex-encoded Ed25519 signature over `msg`.
      required:
      - key
      - msg
      - sig
    SignedPayload:
      type: object
      properties:
        body:
          type: object
          additionalProperties: {}
          description: Arbitrary canonical JSON payload to be processed.
        signature:
          $ref: '#/components/schemas/SignatureBlock'
        validity_range:
          $ref: '#/components/schemas/RangeWindow'
      required:
      - body
      - signature
      - validity_range
    StatusResponse:
      type: object
      properties:
        authenticated:
          type: string
          description: Human-readable authenticated status message
        version:
          type: string
          description: Human-readable api version
        maintenance:
          type: boolean
          description: Human-readable api maintenance boolean
        script_hash:
          type: string
          description: current script hash for the reputation contract
        stake_hash:
          type: string
          description: current stake hash for the reputation contract
        time_zone:
          type: string
          description: current timezone of the server
      required:
      - authenticated
      - maintenance
      - script_hash
      - stake_hash
      - time_zone
      - version
    TierEnum:
      enum:
      - free
      - entry
      - project_1
      - project_2
      - project_3
      - enterprise
      - batcher
      - admin
      type: string
      description: |-
        * `free` - Free
        * `entry` - Entry
        * `project_1` - Project_1
        * `project_2` - Project_2
        * `project_3` - Project_3
        * `enterprise` - Enterprise
        * `batcher` - Batcher
        * `admin` - Admin
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: JWT access token (bearer).
        refresh:
          type: string
          description: JWT refresh token.
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
          description: New JWT access token.
        refresh:
          type: string
          description: Rotated refresh token (only when refresh rotation is enabled).
      required:
      - access
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
