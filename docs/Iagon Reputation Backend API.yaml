    PatchedAccountBurn:
      type: object
      properties:
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the burn validation.
    PatchedAccountMint:
      type: object
      properties:
        public_key_hash:
          type: string
          description: Unique public key hash.
          maxLength: 56
          minLength: 56
        token_name:
          type: string
          description: A unique token identifier.
          maxLength: 64
          minLength: 64
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the mint validation.
    PatchedAccountPatch:
      type: object
      properties:
        token_name:
          type: string
          description: A unique token identifier.
          maxLength: 64
          minLength: 64
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the mint validation.
    PatchedClientTier:
      type: object
      description: Only allows updating the `tier` on an Client.
      properties:
        tier:
          $ref: '#/components/schemas/TierEnum'
    PatchedProjectMembership:
      type: object
      properties:
        public_key:
          type: string
          description: Public key for signature verification
        signature:
          type: string
          description: CIP08 signature of the message
        message:
          type: string
          description: Message containing UUID, PKH, and nonce
    PatchedSignedPayload:
      type: object
      properties:
        body:
          type: object
          additionalProperties: {}
          description: Arbitrary canonical JSON payload to be processed.
        signature:
          $ref: '#/components/schemas/SignatureBlock'
        validity_range:
          $ref: '#/components/schemas/RangeWindow'
    ProjectAccountList:
      type: object
      properties:
        policy_id:
          type: string
