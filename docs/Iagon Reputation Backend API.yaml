components:
  schemas:
    AccountBurn:
      type: object
      properties:
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the burn validation.
      required:
      - tx_cbor
    AccountMint:
      type: object
      properties:
        public_key_hash:
          type: string
          description: Unique public key hash.
          maxLength: 56
          minLength: 56
        token_name:
          type: string
          description: A unique token identifier.
          maxLength: 64
          minLength: 64
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the mint validation.
      required:
      - public_key_hash
      - token_name
      - tx_cbor
    AccountPatch:
      type: object
      properties:
        token_name:
          type: string
          description: A unique token identifier.
          maxLength: 64
          minLength: 64
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the mint validation.
      required:
      - token_name
      - tx_cbor
    AccountTokenName:
      type: object
      properties:
        policy_id:
          type: string
          description: Policy Id associated with this account.
        token_name:
          type: string
          description: Token name associated with this account.
        is_active:
          type: boolean
          description: Is the account active?
      required:
      - is_active
      - policy_id
      - token_name
    BadgeAccountList:
      type: object
      description: Lightweight read-only view of accounts that hold a given badge.
      properties:
        public_key_hash:
          type: string
          readOnly: true
        policy_id:
          type: string
          readOnly: true
        token_name:
