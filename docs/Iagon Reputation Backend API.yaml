          type: string
          readOnly: true
      required:
      - data_hash
      - public_key_hash
      - token_name
    ClientCreate:
      type: object
      description: |-
        Admin-only: Creates a new Client at the requested tier.
        A throwaway Django user is auto-generated with no login.
      properties:
        tier:
          $ref: '#/components/schemas/TierEnum'
      required:
      - tier
    ClientCreateResponse:
      type: object
      properties:
        key:
          type: string
          format: uuid
          description: New API key (UUID) assigned to the client.
        tier:
          allOf:
          - $ref: '#/components/schemas/TierEnum'
          description: |-
            Tier assigned to the client.

            * `free` - Free
            * `entry` - Entry
            * `project_1` - Project_1
            * `project_2` - Project_2
            * `project_3` - Project_3
            * `enterprise` - Enterprise
            * `batcher` - Batcher
            * `admin` - Admin
        username:
          type: string
          description: Username of the client
      required:
      - key
      - tier
      - username
    ClientRotateResponse:
      type: object
      properties:
        key:
          type: string
          format: uuid
