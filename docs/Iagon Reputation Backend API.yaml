          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 32
        units:
          type: string
          maxLength: 16
        weight:
          type: number
          format: double
          maximum: 18446744073709551615
          minimum: 0.0
        description:
          type: string
        default_value:
          type: number
          format: double
          maximum: 18446744073709551615
          minimum: 0.0
        is_active:
          type: boolean
          readOnly: true
