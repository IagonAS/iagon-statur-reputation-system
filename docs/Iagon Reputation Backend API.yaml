openapi: 3.0.3
info:
  title: Iagon Reputation Backend API
  version: v0.6.0
  description: A stand alone backend that handles reputation data.
paths:
  /api/accounts/{public_key_hash}/:
    get:
      operationId: accounts_retrieve
      description: |
        - **GET** retrieves account metadata.
        - **PUT** creates the account at this public key hash (idempotent).
        - **PATCH** reactivates the account using a mint proof.
        - **DELETE** deactivates the account (soft delete) using a burn proof.
      summary: Retrieve, create, update, or deactivate an account
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    put:
      operationId: accounts_update
      description: |
        - **GET** retrieves account metadata.
        - **PUT** creates the account at this public key hash (idempotent).
        - **PATCH** reactivates the account using a mint proof.
        - **DELETE** deactivates the account (soft delete) using a burn proof.
      summary: Retrieve, create, update, or deactivate an account
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          PUT:
            schema:
              $ref: '#/components/schemas/AccountMint'
          DELETE:
            schema:
              $ref: '#/components/schemas/AccountBurn'
          PATCH:
            schema:
              $ref: '#/components/schemas/AccountPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: accounts_partial_update
      description: |
        - **GET** retrieves account metadata.
        - **PUT** creates the account at this public key hash (idempotent).
        - **PATCH** reactivates the account using a mint proof.
        - **DELETE** deactivates the account (soft delete) using a burn proof.
      summary: Retrieve, create, update, or deactivate an account
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          PUT:
            schema:
              $ref: '#/components/schemas/PatchedAccountMint'
          DELETE:
            schema:
              $ref: '#/components/schemas/PatchedAccountBurn'
          PATCH:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatch'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: accounts_destroy
      description: |
        - **GET** retrieves account metadata.
        - **PUT** creates the account at this public key hash (idempotent).
        - **PATCH** reactivates the account using a mint proof.
        - **DELETE** deactivates the account (soft delete) using a burn proof.
      summary: Retrieve, create, update, or deactivate an account
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/accounts/{public_key_hash}/badges/:
    get:
      operationId: account_badges_list
      description: Returns a paginated list of badges assigned to the given account.
      summary: List badges assigned to an account
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (1-indexed).
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBadgeEntryList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/accounts/{public_key_hash}/data/:
    get:
      operationId: account_reputation_data_retrieve
      description: Returns the canonical reputation data payload for the given account.
      summary: Retrieve canonical reputation data
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/accounts/{public_key_hash}/hash/:
    get:
      operationId: account_hash_retrieve
      description: Returns the Blake2b-256 hash of the canonical JSON representation
        of the account's reputation data.
      summary: Retrieve reputation data hash
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hash'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/accounts/{public_key_hash}/history/:
    get:
      operationId: accounts_history_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: public_key_hash
        schema:
          type: string
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHistoryEntryList'
          description: ''
  /api/accounts/{public_key_hash}/projects/:
    get:
      operationId: accounts_projects_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: public_key_hash
        schema:
          type: string
        required: true
      tags:
      - accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectEntryListList'
          description: ''
  /api/accounts/{public_key_hash}/projects/{project_id}/:
    patch:
      operationId: account_project_join
      description: Adds the account to the project or reactivates its membership.
        Requires a valid CIP-8 signature over the nonce message.
      summary: Add (or reactivate) account membership (idempotent)
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        description: Project UUID.
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectMembership'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProjectMembership'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectMembership'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    delete:
      operationId: account_project_leave
      description: Marks the account's membership for this project as inactive. Requires
        a valid CIP-8 signature over the nonce message.
      summary: Deactivate account membership (idempotent)
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        description: Project UUID.
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/accounts/{public_key_hash}/projects/{project_id}/nonce/:
    get:
      operationId: account_project_membership_nonce
      description: 'Returns a short-lived message the client must CIP-8 sign. The
        message format is: `{project_id}:{public_key_hash}:{nonce}`.'
      summary: Get nonce message to sign for membership change
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        description: Project UUID.
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/accounts/{public_key_hash}/score/:
    get:
      operationId: account_score_retrieve
      description: Returns the computed reputation score(s) for the given account
        public key hash.
      summary: Retrieve account reputation score
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scores'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/badges/:
    post:
      operationId: badge_create
      description: Create a new `BadgeEntry` with a `name`, `image`, and optional
        `extra` data. Each badge is attached to a project; accounts are added to the
        badge later.
      summary: Create a new badge
      tags:
      - Badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedPayload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignedPayload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignedPayload'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/badges/{badge_id}/:
    get:
      operationId: badges_retrieve
      description: |
        **GET** returns a public representation of the badge, including any extra attributes under an `attributes` object.

        **PATCH** allows a project to update *only* the `name`, `image`, and `extra` fields; all other fields are read-only.
      summary: Retrieve or partially update a badge
      parameters:
      - in: path
        name: badge_id
        schema:
          type: string
          format: uuid
        description: UUID of the badge
        required: true
      tags:
      - Badges
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeEntry'
          description: ''
    patch:
      operationId: badge_partial_update
      description: |
        **GET** returns a public representation of the badge, including any extra attributes under an `attributes` object.

        **PATCH** allows a project to update *only* the `name`, `image`, and `extra` fields; all other fields are read-only.
      summary: Retrieve or partially update a badge
      parameters:
      - in: path
        name: badge_id
        schema:
          type: string
          format: uuid
        description: UUID of the badge
        required: true
      tags:
      - Badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSignedPayload'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSignedPayload'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSignedPayload'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgeEntry'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/badges/{badge_id}/accounts/:
    get:
      operationId: badges_accounts_list
      description: Returns a paginated list of accounts that currently hold the specified
        badge.
      summary: List accounts for a badge
      parameters:
      - in: path
        name: badge_id
        schema:
          type: string
          format: uuid
        description: UUID of the badge
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Results page (1-indexed).
      tags:
      - Badges
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBadgeAccountListList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/badges/{badge_id}/accounts/{public_key_hash}/:
    put:
      operationId: badge_account_assign
      description: Verifies the signed nonce and idempotently creates the badge↔account
        relationship. No-op if already assigned.
      summary: Assign badge to account (idempotent)
      parameters:
      - in: path
        name: badge_id
        schema:
          type: string
          format: uuid
        description: UUID of the badge
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: PKH of the account
        required: true
      tags:
      - Badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeAssignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Badge successfully assigned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/badges/{badge_id}/accounts/{public_key_hash}/nonce/:
    get:
      operationId: badge_account_nonce
      description: Returns a short-lived message the client must sign to prove authorization
        for assigning a badge to an account. The format is `{badge_id}:{public_key_hash}:{nonce}`.
      summary: Get nonce message to sign for badge assignment
      parameters:
      - in: path
        name: badge_id
        schema:
          type: string
          format: uuid
        description: UUID of the badge
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: PKH of the account
        required: true
      tags:
      - Badges
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/batcher/accounts/:
    get:
      operationId: batcher_accounts_list
      description: |
        Returns a paginated list of accounts matching the reputation policy.

        Each entry contains:
        - `public_key_hash` (Cardano public key hash)
        - `token_name` (unique token identifier)
        - `data_hash` (Blake2b-256 of the canonical JSON payload)
      summary: 'Batcher: list accounts with data hash'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (1-based).
      tags:
      - Batcher
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatcherAccountList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/clients/:
    post:
      operationId: client_create
      description: Admin-only (tier >= admin). Creates a new API client and returns
        its API key and tier.
      summary: Create API client
      tags:
      - Clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClientCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClientCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCreateResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
