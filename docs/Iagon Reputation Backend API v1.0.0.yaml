openapi: 3.0.3
info:
  title: Iagon Reputation Backend API
  version: v1.0.0
  description: |-
    A standalone backend that tracks Cardano account reputation, weighted metrics, project memberships, and badges.

    ## Authentication

    Two layers:

    1. **Long-lived client API key** (UUID, issued by an admin). Exchange it at `POST /api/v1/token/` for a JWT pair (`{access, refresh}`).
    2. **Short-lived JWT access token**. Send it as `Authorization: Bearer <access>` on every authenticated request. Refresh at `POST /api/v1/token/refresh/`.

    The access token carries a `tier` claim that gates which endpoints you can call (`free` < `entry` < `project_1` < ... < `enterprise` < `batcher` < `admin`).

    ## Signed payload envelope

    Every **mutation** that affects an Account, Project, Metric, or Badge requires a signed body. The wire format is:

    ```json
    {
      "body": { ... actual request data, sorted keys ... },
      "signature": {
        "key": "<hex public key>",
        "msg": "<hex>",
        "sig": "<hex Ed25519 signature>"
      },
      "validity_range": {
        "invalid_before": <unix seconds>,
        "invalid_after":  <unix seconds>
      }
    }
    ```

    **Computing `msg`:**

    1. CBOR-canonical-encode `body` and `validity_range` **separately**.
    2. Blake2b-256 each of the two CBOR blobs (32-byte digests).
    3. Concatenate the two hex digests — `msg = blake2b(cbor(body)) + blake2b(cbor({"validity_range": validity_range}))`. The result is 128 hex characters.
    4. Sign `msg` with the account's Ed25519 private key. The `signature.key` field carries the matching public key.

    Both `body` and `validity_range` MUST be in **RFC 8785 canonical JSON** form (sorted keys, no NaN/Infinity). Non-canonical payloads return `400`.

    **Replay protection:** the server caches `sha256(msg + sig)` for up to 300 seconds. Sending the same payload twice returns `400 {"detail": "Duplicate payload"}`.

    ## Errors

    Two response shapes, both always carrying a `detail` field:

    - **Hand-built errors** (404, 403, 409, 429, 503, business rule rejections):
      ```json
      {"detail": "Human-readable message"}
      ```
    - **Validation errors** (400 from request body / query param validation):
      ```json
      {
        "detail": "Request validation failed",
        "errors": {
          "<field>": ["error message", ...]
        }
      }
      ```

    ## Verb conventions

    Most resources follow standard REST: `POST /<collection>/` creates, `GET /<collection>/{id}/` retrieves, `PATCH /<collection>/{id}/` updates, `DELETE` would remove. A few endpoints — notably account/project deactivation — use `POST /<collection>/{id}/` with a signed burn-proof body instead of `DELETE`. This is intentional: `DELETE` requests with bodies are not universally supported by HTTP infrastructure (some proxies and CDNs strip the body), and the burn proof must travel in the body. The OpenAPI summary for each affected endpoint says so explicitly.
paths:
  /api/v1/accounts/{public_key_hash}/:
    get:
      operationId: account_retrieve
      description: Returns the account policy_id, token_name, and is_active flag.
      summary: Retrieve account metadata
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    post:
      operationId: account_deactivate
      description: Deactivates the account. Requires a valid burn proof payload. If
        the account is already inactive, returns 204.
      summary: Deactivate account (burn proof required)
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountBurn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountBurn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountBurn'
        required: true
      responses:
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    put:
      operationId: account_create_idempotent
      description: Creates the account at this public key hash. If the account already
        exists, returns the existing account. If a different token_name is supplied
        for an existing account, returns 409.
      summary: Create account (idempotent)
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMint'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountMint'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountMint'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountTokenName'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    patch:
      operationId: account_reactivate
      description: Reactivates a previously deactivated account. Requires a valid
        mint proof payload. Returns 409 if the account is already active.
      summary: Reactivate account (mint proof required)
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: The account's public key hash (resource ID).
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAccountPatch'
      responses:
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
