          description: ''
  /api/v1/accounts/{public_key_hash}/projects/{project_id}/:
    post:
      operationId: account_project_leave
      description: Marks the account's membership for this project as inactive. Requires
        a valid CIP-8 signature over the nonce message.
      summary: Deactivate account membership (idempotent)
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        description: Project UUID.
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembership'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectMembership'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectMembership'
        required: true
      responses:
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
    put:
      operationId: account_project_join
      description: Adds the account to the project or reactivates its membership.
        Requires a valid CIP-8 signature over the nonce message.
      summary: Add (or reactivate) account membership (idempotent)
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        description: Project UUID.
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMembership'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectMembership'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectMembership'
        required: true
      responses:
        '204':
          description: No content
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/{public_key_hash}/projects/{project_id}/nonce/:
    get:
      operationId: account_project_membership_nonce
      description: 'Returns a short-lived message the client must CIP-8 sign. The
        message format is: `{project_id}:{public_key_hash}:{nonce}`.'
      summary: Get nonce message to sign for membership change
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        description: Project UUID.
        required: true
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nonce'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/{public_key_hash}/score/:
    get:
      operationId: account_score_retrieve
      description: Returns the computed reputation score(s) for the given account
        public key hash.
      summary: Retrieve account reputation score
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scores'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/audit/:
    get:
      operationId: audit_list
      description: |-
        GET /api/audit/

        Admin-only. Returns a paginated, filterable list of all audit log entries.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/batcher/accounts/:
    get:
      operationId: batcher_accounts_list
      description: |
        Returns a paginated list of accounts matching the reputation policy.

        Each entry contains:
        - `public_key_hash` (Cardano public key hash)
        - `token_name` (unique token identifier)
        - `data_hash` (Blake2b-256 of the canonical JSON payload)
      summary: 'Batcher: list accounts with data hash'
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (1-based).
      tags:
      - Batcher
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatcherAccountList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/clients/:
