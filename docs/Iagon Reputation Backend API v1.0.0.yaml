        GET /api/accounts/{public_key_hash}/audit/

        Leader-scoped. Returns audit logs for the specified account.
        Requester must lead a project the account belongs to.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: path
        name: public_key_hash
        schema:
          type: string
        required: true
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/accounts/{public_key_hash}/badges/:
    get:
      operationId: account_badges_list
      description: Returns a paginated list of badges assigned to the given account.
      summary: List badges assigned to an account
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (1-indexed).
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
