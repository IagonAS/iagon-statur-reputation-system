          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/FloatMetric'
    PaginatedProjectAccountDataListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAccountDataList'
    PaginatedProjectAccountListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAccountList'
    PaginatedProjectAccountScoreListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAccountScoreList'
    PaginatedProjectEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEntry'
    PaginatedProjectEntryListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectEntryList'
    PatchedAccountPatch:
      type: object
      properties:
        token_name:
          type: string
          description: A unique token identifier.
          maxLength: 64
          minLength: 64
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the mint validation. Must
            be canonical CBOR (re-encoding the body must round-trip).
          maxLength: 16384
    PatchedClientTier:
      type: object
      description: Only allows updating the `tier` on an Client.
      properties:
        tier:
          $ref: '#/components/schemas/TierEnum'
    PatchedSignedPayload:
      type: object
      properties:
        body:
          type: object
          additionalProperties: {}
          description: Arbitrary canonical JSON payload to be processed.
        signature:
          $ref: '#/components/schemas/SignatureBlock'
        validity_range:
          $ref: '#/components/schemas/RangeWindow'
    ProjectAccountDataList:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/ProjectAccountList'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAccountMetricEntry'
      required:
      - account
      - metrics
    ProjectAccountList:
      type: object
      properties:
        policy_id:
          type: string
          readOnly: true
          description: Policy Id associated with this account.
        public_key_hash:
          type: string
          readOnly: true
          description: Unique public key hash.
        token_name:
          type: string
          readOnly: true
          description: Token name associated with this account.
        account_is_active:
          type: boolean
          readOnly: true
          description: Is the account active globally?
        membership_is_active:
          type: boolean
          readOnly: true
          description: Is this account active for this project (ProjectAccountStatus.is_active)?
        membership_deactivated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this account was deactivated for this project (if inactive).
      required:
      - account_is_active
      - membership_deactivated_at
      - membership_is_active
      - policy_id
      - public_key_hash
      - token_name
    ProjectAccountMetricEntry:
      type: object
      properties:
        project:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        metric_label:
          type: string
          readOnly: true
        units:
          type: string
          readOnly: true
        weight:
          type: string
          pattern: ^(0|[1-9]\d*)\.\d{6}$
          example: '1.500000'
          readOnly: true
        description:
          type: string
          readOnly: true
        default_value:
          type: string
          pattern: ^(0|[1-9]\d*)\.\d{6}$
          example: '1.500000'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        value:
          type: string
          pattern: ^(0|[1-9]\d*)\.\d{6}$
          example: '1.500000'
          readOnly: true
      required:
      - default_value
      - description
      - is_active
      - key
      - metric_label
      - project
      - units
      - value
      - weight
    ProjectAccountScoreList:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/ProjectAccountList'
        score:
          type: string
      required:
      - account
      - score
    ProjectEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        accounts:
          type: integer
          readOnly: true
          description: Count of accounts joined to this project. By default counts
            only active ProjectAccountStatus rows; use include_inactive=true to include
            inactive statuses.
        name:
          type: string
          description: A human readable project name
          minLength: 1
          maxLength: 128
        public_key:
          type: string
          description: Public key used to sign valid transitions.
          minLength: 64
          maxLength: 64
        description:
          type: string
          description: Optional human description of the project
          maxLength: 512
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was last updated
        score_decay:
          type: integer
          maximum: 2147483647
          minimum: 1
          default: 30
          description: The length of time for a user's score to decay by e.
        image:
          type: string
          default: https://placehold.co/500
          description: Image link for the project. Send blank or omit to use the default
            image.
      required:
      - accounts
      - created_at
      - id
      - name
      - public_key
      - updated_at
    ProjectEntryList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          description: A human readable project name
        description:
          type: string
          readOnly: true
          description: Optional human description of the project
        score_decay:
          type: integer
          readOnly: true
          description: The length of time for a users score to decay by e.
        image:
          type: string
          readOnly: true
          description: URI (http, https, ipfs, data) of an image
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was created
        updated_at:
          type: string
          format: date-time
          readOnly: true
          description: When this project was last updated
      required:
      - created_at
      - description
      - id
      - image
      - is_active
      - name
      - score_decay
      - updated_at
    ProjectMembership:
      type: object
      properties:
        public_key:
          type: string
          description: Public key for signature verification
          maxLength: 512
          minLength: 1
        signature:
          type: string
          description: CIP08 signature of the message
          maxLength: 1024
          minLength: 1
        message:
          type: string
          description: Message containing UUID, PKH, and nonce
          maxLength: 512
          minLength: 1
      required:
      - message
      - public_key
      - signature
    ProjectTier:
      type: object
      properties:
        tier:
          type: string
        rate:
          type: string
          nullable: true
        project_limit:
          type: integer
          minimum: 0
        metric_limit:
          type: integer
          minimum: 0
        badge_limit:
          type: integer
          minimum: 0
      required:
      - badge_limit
      - metric_limit
      - project_limit
      - rate
      - tier
    RangeWindow:
      type: object
      properties:
        invalid_after:
          type: integer
          maximum: 18446744073709551615
          format: int64
          description: Unix timestamp (seconds). Payload is invalid after this time
            (exclusive). Required.
        invalid_before:
          type: integer
          minimum: 0
          description: Unix timestamp (seconds). Payload is invalid before this time
            (inclusive). Required.
      required:
      - invalid_after
      - invalid_before
    Score:
      type: object
      description: |-
        Serializer for returning a single reputation score as a canonical scale-6
        decimal string (payload format v2).
      properties:
        score:
          type: string
          description: An account's reputation score (canonical decimal string)
      required:
      - score
    Scores:
      type: object
      description: |-
        Serializer for returning a dict of per-project reputation scores as canonical
        scale-6 decimal strings (payload format v2).
      properties:
        scores:
          type: object
          additionalProperties:
            type: string
          nullable: true
    SignatureBlock:
      type: object
      properties:
        key:
          type: string
          description: 'Public key of the signer (encoding TBD: hex/base58/base64).'
          maxLength: 256
          minLength: 1
        msg:
          type: string
          description: Hex-encoded message that was signed (e.g., CBOR→Blake2b-256).
          maxLength: 256
          minLength: 1
        sig:
          type: string
          description: Hex-encoded Ed25519 signature over `msg`.
          maxLength: 256
          minLength: 1
      required:
      - key
      - msg
      - sig
    SignedPayload:
      type: object
      properties:
        body:
          type: object
          additionalProperties: {}
          description: Arbitrary canonical JSON payload to be processed.
        signature:
          $ref: '#/components/schemas/SignatureBlock'
        validity_range:
          $ref: '#/components/schemas/RangeWindow'
      required:
      - body
      - signature
      - validity_range
    StatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
          description: Whether the request was authenticated
        version:
          type: string
          description: Human-readable api version
        maintenance:
          type: boolean
          description: Human-readable api maintenance boolean
        script_hash:
          type: string
          description: current script hash for the reputation contract
        stake_hash:
          type: string
          description: current stake hash for the reputation contract
        time_zone:
          type: string
          description: current timezone of the server
      required:
      - authenticated
      - maintenance
      - script_hash
      - stake_hash
      - time_zone
      - version
    Tier:
      type: object
      properties:
        name:
          type: string
          description: Tier identifier
        rate_limit:
          type: string
          nullable: true
          description: Rate limit (e.g. '60/min') or null for unlimited
        max_metrics:
          type: integer
          nullable: true
          description: Maximum metrics per project, null if unrestricted
        max_badges:
          type: integer
          nullable: true
          description: Maximum badges per project, null if unrestricted
        max_projects:
          type: integer
          nullable: true
          description: Maximum projects, null if unrestricted
      required:
      - max_badges
      - max_metrics
      - max_projects
      - name
      - rate_limit
    TierEnum:
      enum:
      - free
      - entry
      - project_1
      - project_2
      - project_3
      - enterprise
      - batcher
      - admin
      type: string
      description: |-
        * `free` - Free
        * `entry` - Entry
        * `project_1` - Project_1
        * `project_2` - Project_2
        * `project_3` - Project_3
        * `enterprise` - Enterprise
        * `batcher` - Batcher
        * `admin` - Admin
    TiersResponse:
      type: object
      properties:
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/Tier'
          description: Per-tier rate limits and quotas
      required:
      - tiers
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: JWT access token (bearer).
        refresh:
          type: string
          description: JWT refresh token.
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
          description: New JWT access token.
        refresh:
          type: string
          description: Rotated refresh token (only when refresh rotation is enabled).
      required:
      - access
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Accounts
  description: Account Management
- name: Clients
  description: Client Management
- name: Projects
  description: Project Management
- name: Authentication
  description: Token Management
- name: Utility
  description: Utility Endpoints
- name: Batcher
  description: Batcher Endpoints
- name: Badges
  description: Badge Management
- name: Metrics
  description: Metric Management
