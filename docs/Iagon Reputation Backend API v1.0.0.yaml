  /api/v1/health/:
    get:
      operationId: health_check
      description: Readiness probe. Verifies database and cache connectivity. Returns
        200 when all services are reachable, 503 when one or more are unavailable.
        For liveness (process-alive only) use GET /api/v1/live/ instead.
      summary: Readiness check
      tags:
      - Utility
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthUnavailable'
          description: ''
  /api/v1/live/:
    get:
      operationId: liveness_check
      description: Liveness probe. Returns 200 as long as the process can serve a
        response. Does NOT check DB or cache — use GET /api/v1/health/ for that. Intended
        for orchestrator restart-on-failure checks.
      summary: Liveness check
      tags:
      - Utility
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
