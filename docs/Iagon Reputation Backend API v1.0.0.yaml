      description: Returns the Blake2b-256 hash of the canonical JSON representation
        of the account's reputation data.
      summary: Retrieve reputation data hash
      parameters:
      - in: path
        name: public_key_hash
        schema:
          type: string
        description: Account public key hash.
        required: true
      tags:
      - Accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hash'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/accounts/{public_key_hash}/projects/:
