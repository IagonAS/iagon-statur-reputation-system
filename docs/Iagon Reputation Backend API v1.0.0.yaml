components:
  schemas:
    AccountBurn:
      type: object
      properties:
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the burn validation. Must
            be canonical CBOR (re-encoding the body must round-trip).
          maxLength: 16384
      required:
      - tx_cbor
    AccountMint:
      type: object
      properties:
        public_key_hash:
          type: string
          description: Unique public key hash.
          maxLength: 56
          minLength: 56
        token_name:
          type: string
          description: A unique token identifier.
          maxLength: 64
          minLength: 64
        tx_cbor:
          type: string
          writeOnly: true
          description: A valid transaction in CBOR proving the mint validation. Must
            be canonical CBOR (re-encoding the body must round-trip).
          maxLength: 16384
      required:
      - public_key_hash
      - token_name
      - tx_cbor
    AccountTokenName:
      type: object
      properties:
        policy_id:
          type: string
          description: Policy Id associated with this account.
        token_name:
          type: string
          description: Token name associated with this account.
        is_active:
          type: boolean
          description: Is the account active?
        created_at:
          type: string
          format: date-time
          description: When the account was created.
        updated_at:
          type: string
          format: date-time
          description: When the account was last modified.
      required:
      - created_at
      - is_active
      - policy_id
      - token_name
      - updated_at
    ActionEnum:
      enum:
      - create
      - update
      - delete
      - activate
      - deactivate
      - assign
      - unassign
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
        * `activate` - Activate
        * `deactivate` - Deactivate
        * `assign` - Assign
        * `unassign` - Unassign
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          readOnly: true
        entity_id:
          type: string
          readOnly: true
          description: String representation of the entity PK (UUID or int).
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
        data:
          readOnly: true
          description: Before/after snapshot or full entity state.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_id
      - created_at
      - data
      - entity_id
      - entity_type
      - id
    BadgeAccountList:
      type: object
      description: Lightweight read-only view of accounts that hold a given badge.
      properties:
        public_key_hash:
          type: string
          readOnly: true
        policy_id:
          type: string
          readOnly: true
        token_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - is_active
      - policy_id
      - public_key_hash
      - token_name
    BadgeAssignment:
      type: object
      properties:
        key:
          type: string
          description: Public key for signature verification
          maxLength: 256
          minLength: 1
        sig:
          type: string
          description: ED25519 signature of the message
          maxLength: 256
          minLength: 1
        msg:
          type: string
          description: Hex encoded preimage
          maxLength: 256
          minLength: 1
        preimage:
          type: string
          description: Message containing UUID, PKH, and nonce
          maxLength: 256
          minLength: 1
      required:
      - key
      - msg
      - preimage
      - sig
    BadgeEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        accounts:
          type: array
          items:
            type: integer
          readOnly: true
          description: List of Account IDs that have this badge
        name:
          type: string
          description: A human readable badge name
          minLength: 1
          maxLength: 256
        image:
          type: string
          description: Image link for the badge
          minLength: 1
          maxLength: 1000
        extra:
          type: object
          additionalProperties: {}
          description: Additional data for the badge (optional, defaults to empty
            object)
        project:
          type: string
          format: uuid
          description: ID of the Project that attach to this badge
        is_active:
          type: boolean
          readOnly: true
      required:
      - accounts
      - id
      - image
      - is_active
      - name
      - project
    BadgePublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
        name:
          type: string
        image:
          type: string
        is_active:
          type: boolean
        attributes:
          type: object
          additionalProperties: {}
          description: Arbitrary attributes (merged into top-level at runtime).
      required:
      - attributes
      - id
      - image
      - is_active
      - name
      - project
    BatcherAccount:
      type: object
      properties:
        public_key_hash:
          type: string
          readOnly: true
        token_name:
          type: string
          readOnly: true
        data_hash:
          type: string
          readOnly: true
      required:
      - data_hash
      - public_key_hash
      - token_name
    ClientCreate:
      type: object
      description: |-
        Admin-only: Creates a new Client at the requested tier.
        A throwaway Django user is auto-generated with no login.
      properties:
        tier:
          $ref: '#/components/schemas/TierEnum'
      required:
      - tier
    ClientCreateResponse:
      type: object
      properties:
        key:
          type: string
          format: uuid
          description: New API key (UUID) assigned to the client.
        tier:
          allOf:
          - $ref: '#/components/schemas/TierEnum'
          description: |-
            Tier assigned to the client.

            * `free` - Free
            * `entry` - Entry
            * `project_1` - Project_1
            * `project_2` - Project_2
            * `project_3` - Project_3
            * `enterprise` - Enterprise
            * `batcher` - Batcher
            * `admin` - Admin
        username:
          type: string
          description: Username of the client
      required:
      - key
      - tier
      - username
    ClientRotateResponse:
      type: object
      properties:
        key:
          type: string
          format: uuid
          description: Freshly minted client API key (UUID).
      required:
      - key
    ClientTier:
      type: object
      description: Only allows updating the `tier` on an Client.
      properties:
        tier:
          $ref: '#/components/schemas/TierEnum'
    ClientToken:
      type: object
      description: |-
        Accepts a Client.key (UUID) and returns nothing here,
        the view will issue the token pair on valid input.
      properties:
        key:
          type: string
          format: uuid
          description: Your Client key (UUID)
      required:
      - key
    Detail:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable message describing the result or error.
      required:
      - detail
    EntityTypeEnum:
      enum:
      - account
      - project
      - metric
      - badge
      - client
      - membership
      type: string
      description: |-
        * `account` - Account
        * `project` - Project
        * `metric` - Metric
        * `badge` - Badge
        * `client` - Client
        * `membership` - Membership
    FloatMetric:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          maxLength: 64
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          maxLength: 32
        units:
          type: string
          maxLength: 16
        weight:
          type: string
          pattern: ^(0|[1-9]\d*)\.\d{6}$
          example: '1.500000'
        description:
          type: string
        default_value:
          type: string
          pattern: ^(0|[1-9]\d*)\.\d{6}$
          example: '1.500000'
        is_active:
          type: boolean
          readOnly: true
      required:
      - default_value
      - id
      - is_active
      - key
      - project
      - weight
    Hash:
      type: object
      description: Serializer for returning the data hash
      properties:
        hash:
          type: string
      required:
      - hash
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Service status
      required:
      - status
    HealthUnavailable:
      type: object
      properties:
        status:
          type: string
          description: Service status
        services:
          type: array
          items:
            type: string
          description: List of unavailable services
      required:
      - services
      - status
    Nonce:
      type: object
      properties:
        nonce:
          type: string
          description: Short-lived message the client must sign to prove authorization.
      required:
      - nonce
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    PaginatedBadgeAccountListList:
      type: object
