<text x="478" y="894" font-size="13" letter-spacing="-0.05" fill="#6E6E78">Measured in ADA, not IAG</text>

<rect x="812" y="744" width="334" height="176" rx="16" fill="#FFFFFF" stroke="#E8E7E3" stroke-width="1"/>
<rect x="836" y="774" width="9" height="9" rx="2.5" fill="#B3ACE9"/>
