<rect x="1170" y="744" width="334" height="176" rx="16" fill="#FFFFFF" stroke="#E8E7E3" stroke-width="1"/>
<rect x="1194" y="774" width="9" height="9" rx="2.5" fill="#CBC6F2"/>
<text x="1214" y="783" font-size="17" font-weight="600" letter-spacing="-0.2" fill="#16161A">Storage subscriber</text>
<text x="1480" y="783" font-size="19" font-weight="500" text-anchor="end" letter-spacing="-0.3" fill="#4A3F9E">0.05</text>
<line x1="1194" y1="802" x2="1480" y2="802" stroke="#EFEEEA" stroke-width="1"/>
<text x="1194" y="834" font-size="15" letter-spacing="-0.1" fill="#3D3D45">Subscription size</text>
<text x="1194" y="860" font-size="15" letter-spacing="-0.1" fill="#3D3D45">Storage used</text>
<text x="1194" y="886" font-size="15" letter-spacing="-0.1" fill="#3D3D45">Subscription duration</text>

<line x1="96" y1="960" x2="1504" y2="960" stroke="#E8E7E3" stroke-width="1"/>
<text x="96" y="986" font-size="13" letter-spacing="-0.05" fill="#6E6E78">Statur imposes no fixed set of metrics — each project defines its own categories, value ranges and weights. Everything above is Iagon's configuration.</text>
<text x="96" y="1008" font-size="13" letter-spacing="-0.05" fill="#6E6E78">Weights within each category, and the underlying value scales, are internal and out of scope at this milestone.</text>
<text x="1504" y="986" font-size="13" text-anchor="end" letter-spacing="-0.05" fill="#6E6E78">docs.iagon.com/products/statur</text>
</svg>
