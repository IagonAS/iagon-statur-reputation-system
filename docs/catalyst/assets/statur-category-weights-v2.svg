<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="ttl desc" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Inter, sans-serif">
<title id="ttl">Karma points and category weights</title>
<desc id="desc">Iagon's Statur configuration: the scoring formula with exponential decay, a proportional bar of eight category weights summing to 1.00, and the metrics that make up each category.</desc>

<rect x="0" y="0" width="1600" height="1040" fill="#FCFCFB"/>

<text x="96" y="98" font-size="40" font-weight="600" letter-spacing="-1.1" fill="#16161A">Karma points and category weights</text>
<text x="96" y="134" font-size="17" letter-spacing="-0.1" fill="#75757E">Iagon's own instantiation of Statur · eight categories, weights summing to 1.00</text>

<line x1="96" y1="166" x2="1504" y2="166" stroke="#E8E7E3" stroke-width="1"/>

<rect x="96" y="194" width="1408" height="112" rx="18" fill="#F5F4F1"/>
<text x="800" y="248" font-size="22" text-anchor="middle" letter-spacing="-0.2" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" fill="#16161A">score = ( Σ(value · weight) / Σ(weight) ) · e^(−days_inactive / decay_rate)</text>
<text x="800" y="280" font-size="15" text-anchor="middle" letter-spacing="-0.1" fill="#75757E">A weighted average of the category scores, decaying exponentially while an account is idle — shown to users as karma points.</text>

<text x="96" y="356" font-size="13" font-weight="600" letter-spacing="0.6" fill="#6E6E78">CATEGORY WEIGHTS</text>

<rect x="96" y="376" width="388" height="64" rx="5" fill="#3A3185"/>
<text x="290" y="415" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#FFFFFF">0.28</text>

<rect x="487" y="376" width="250" height="64" rx="5" fill="#4A3F9E"/>
<text x="612" y="415" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#FFFFFF">0.18</text>

<rect x="740" y="376" width="180" height="64" rx="5" fill="#5A4FB5"/>
<text x="830" y="415" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#FFFFFF">0.13</text>

<rect x="923" y="376" width="153" height="64" rx="5" fill="#6B60C6"/>
<text x="999" y="415" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#FFFFFF">0.11</text>

<rect x="1079" y="376" width="139" height="64" rx="5" fill="#7369C9"/>
<text x="1148" y="415" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#FFFFFF">0.10</text>

<rect x="1221" y="376" width="111" height="64" rx="5" fill="#9A91E0"/>
<text x="1276" y="415" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#241E5E">0.08</text>

<rect x="1335" y="376" width="97" height="64" rx="5" fill="#B3ACE9"/>
<text x="1383" y="415" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#241E5E">0.07</text>

<rect x="1435" y="376" width="69" height="64" rx="5" fill="#CBC6F2"/>
<text x="1469" y="415" font-size="16" font-weight="500" text-anchor="middle" letter-spacing="-0.2" fill="#241E5E">0.05</text>

<text x="96" y="470" font-size="14" letter-spacing="-0.1" fill="#6E6E78">Width and depth of tone both track weight. A weight of zero would keep a category tracked but out of the score entirely.</text>

<text x="96" y="524" font-size="13" font-weight="600" letter-spacing="0.6" fill="#6E6E78">WHAT EACH CATEGORY IS BUILT FROM</text>

