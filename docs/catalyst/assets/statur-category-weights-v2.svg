<text x="1480" y="583" font-size="19" font-weight="500" text-anchor="end" letter-spacing="-0.3" fill="#4A3F9E">0.11</text>
<line x1="1194" y1="602" x2="1480" y2="602" stroke="#EFEEEA" stroke-width="1"/>
<text x="1194" y="634" font-size="15" letter-spacing="-0.1" fill="#3D3D45">Staking quantity</text>
<text x="1194" y="660" font-size="15" letter-spacing="-0.1" fill="#3D3D45">Staking duration</text>
<text x="1194" y="694" font-size="13" letter-spacing="-0.05" fill="#6E6E78">Operator or delegator</text>

<rect x="96" y="744" width="334" height="176" rx="16" fill="#FFFFFF" stroke="#E8E7E3" stroke-width="1"/>
<rect x="120" y="774" width="9" height="9" rx="2.5" fill="#7369C9"/>
<text x="140" y="783" font-size="17" font-weight="600" letter-spacing="-0.2" fill="#16161A">Token trader</text>
<text x="406" y="783" font-size="19" font-weight="500" text-anchor="end" letter-spacing="-0.3" fill="#4A3F9E">0.10</text>
<line x1="120" y1="802" x2="406" y2="802" stroke="#EFEEEA" stroke-width="1"/>
<text x="120" y="834" font-size="15" letter-spacing="-0.1" fill="#3D3D45">Total trading volume</text>
<text x="120" y="860" font-size="15" letter-spacing="-0.1" fill="#3D3D45">Buys vs. sells</text>

<rect x="454" y="744" width="334" height="176" rx="16" fill="#FFFFFF" stroke="#E8E7E3" stroke-width="1"/>
<rect x="478" y="774" width="9" height="9" rx="2.5" fill="#9A91E0"/>
<text x="498" y="783" font-size="17" font-weight="600" letter-spacing="-0.2" fill="#16161A">Stake pool delegator</text>
<text x="764" y="783" font-size="19" font-weight="500" text-anchor="end" letter-spacing="-0.3" fill="#4A3F9E">0.08</text>
<line x1="478" y1="802" x2="764" y2="802" stroke="#EFEEEA" stroke-width="1"/>
